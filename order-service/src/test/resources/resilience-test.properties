# Small, fast settings so tests are quick and deterministic. They verify the WIRING
# (which exceptions count, what the fallbacks do), not the production numbers.
resilience4j.circuitbreaker.configs.default.slidingWindowSize=4
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=4
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=60s
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.configs.default.recordFailurePredicate=com.shopsphere.order.integration.DependencyFailurePredicate
resilience4j.circuitbreaker.instances.productService.baseConfig=default
resilience4j.circuitbreaker.instances.userService.baseConfig=default

resilience4j.retry.configs.default.maxAttempts=2
resilience4j.retry.configs.default.waitDuration=10ms
resilience4j.retry.configs.default.retryExceptionPredicate=com.shopsphere.order.integration.DependencyFailurePredicate
resilience4j.retry.instances.productService.baseConfig=default
resilience4j.retry.instances.userService.baseConfig=default

resilience4j.bulkhead.configs.default.maxConcurrentCalls=1
resilience4j.bulkhead.configs.default.maxWaitDuration=0
resilience4j.bulkhead.instances.productService.baseConfig=default
resilience4j.bulkhead.instances.userService.baseConfig=default