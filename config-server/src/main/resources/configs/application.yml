eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    # Adds the correlation ID from the MDC to every log line.
    # Note: no ${...} placeholders here, because the Config Server would try to
    # resolve them itself before sending the file to the client.
    level: "%5p [%X{correlationId:-}]"