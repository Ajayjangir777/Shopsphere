server:
  port: 8080

spring:
  data:
    redis:                      # used by the rate limiter
      host: localhost
      port: 6379
      timeout: 1s
      connect-timeout: 1s

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000   # same value the Auth Server uses as its issuer

  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 5s

      discovery:
        locator:
          enabled: false        # only explicitly declared routes are exposed

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      # NOTE: "globalcors" was removed. CORS is now handled by Spring Security
      # (see GatewaySecurityConfig) so that even 401 responses carry CORS headers.

      routes:
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        - id: auth-register
          uri: lb://auth-server
          predicates:
            - Path=/api/auth/register
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 5
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@registerKeyResolver}"

# Our own settings, read by GatewaySecurityConfig. Comma-separated list of origins
# (web pages) allowed to call the API from a browser.
gateway:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173